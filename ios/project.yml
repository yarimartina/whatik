# Progetto Xcode generato con XcodeGen: `cd ios && xcodegen generate`
name: Whatik
options:
  bundleIdPrefix: com.whatik
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: it
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WhatikCore:
    path: WhatikCore
targets:
  Whatik:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Whatik
    dependencies:
      - package: WhatikCore
        product: WhatikCore
      - package: WhatikCore
        product: WhatikMedia
    info:
      path: Whatik/Info.plist
      properties:
        CFBundleDisplayName: Whatik
        CFBundleDevelopmentRegion: it
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationQueriesSchemes:
          - whatsapp
          - tiktok
          - snssdk1233
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whatik.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
    scheme: {}
